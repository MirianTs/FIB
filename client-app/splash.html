<script>
  (function() {
    const dotsContainer = document.getElementById('splash-dots');
    if (!dotsContainer) return;
    const dots = dotsContainer.querySelectorAll('span');
    let activeIndex = 0;
    setInterval(() => {
      dots.forEach((dot, idx) => {
        if (idx === activeIndex) {
          dot.className = 'w-4 h-2 rounded-full bg-primary transition-all duration-300';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-surface-variant transition-all duration-300';
        }
      });
      activeIndex = (activeIndex + 1) % dots.length;
    }, 450);
  })();
