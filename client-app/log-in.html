<!-- Top Navigation & Brand Header -->
<div class="flex items-center justify-between py-space-sm mb-space-md">
<button aria-label="უკან დაბრუნება" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex items-center gap-space-xs">
<img src="../assets/logo.png" alt="FIB" class="w-8 h-8 object-contain"/>

</div>
<div class="w-10 h-10"></div>
</div>
<!-- Welcome / Titles Block -->
<div class="mb-space-lg">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary/10 text-primary font-label-sm text-label-sm mb-space-xs">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span>დაცული კავშირი</span>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface mb-space-xs">
      მოგესალმებით
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
      შეიყვანეთ მონაცემები თქვენს ანგარიშზე შესასვლელად
    </p>
</div>
<!-- Primary Login Form Card -->
<div class="bg-surface-container rounded-2xl p-space-md shadow-xl mb-space-lg">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault();">
<!-- Identifier Field (Email / Phone) -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="login-identifier">
          ელფოსტა ან ტელეფონის ნომერი
        </label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3 focus-within:ring-2 focus-within:ring-primary/40 transition-all">
<span class="material-symbols-outlined text-secondary mr-2 text-[20px]">alternate_email</span>
<input autocomplete="username" class="w-full bg-transparent text-on-surface font-body-md text-body-md placeholder-secondary/50 focus:outline-none" id="login-identifier" placeholder="example@mail.com ან +995..." type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="login-password">
          პაროლი
        </label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3 focus-within:ring-2 focus-within:ring-primary/40 transition-all">
<span class="material-symbols-outlined text-secondary mr-2 text-[20px]">key</span>
<input autocomplete="current-password" class="w-full bg-transparent text-on-surface font-body-md text-body-md placeholder-secondary/50 focus:outline-none" id="login-password" placeholder="••••••••••••" type="password"/>
<button aria-label="პაროლის ჩვენება/დამალვა" class="text-secondary hover:text-primary transition-colors flex items-center justify-center p-1" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="font-label-md text-label-md text-primary hover:underline inline-block" href="#">
            დაგავიწყდა პაროლი?
          </a>
</div>
</div>
<!-- Submit Primary Action -->
<button class="w-full mt-2 bg-primary-container text-on-primary py-3.5 px-5 rounded-2xl font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-all" id="submitBtn" type="submit">
<span>შესვლა</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Divider: ან -->
<div class="flex items-center gap-4 mb-space-lg px-2">
<div class="flex-1 h-[1px] bg-surface-variant"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">ან</span>
<div class="flex-1 h-[1px] bg-surface-variant"></div>
</div>
<!-- Social Auth Section -->
<div class="flex flex-col gap-space-sm mb-space-xl">
<button class="w-full bg-surface-container hover:bg-surface-container-high text-on-surface py-3.5 px-4 rounded-2xl font-label-lg text-label-lg flex items-center justify-center gap-3 transition-colors active:scale-[0.98] shadow-sm" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Google-ით ავტორიზაცია</span>
</button>
</div>
<!-- Registration Redirection Footer -->
<div class="mt-auto text-center pt-space-md">
<p class="font-body-md text-body-md text-on-surface-variant">
      არ გაქვს ანგარიში? 
      <a class="font-label-lg text-label-lg text-primary hover:underline ml-1" href="#">
        დარეგისტრირდი
      </a>
</p>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('login-password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main><script src="../assets/app-nav.js" data-data="../assets/client-app-data.js" data-var="FIB_CLIENT_APP"></script>
