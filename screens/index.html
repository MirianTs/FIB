<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIB — Mobile Screens</title>
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Georgian:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { primary: '#00647c', 'primary-container': '#007f9d', secondary: '#006c4e', 'secondary-fixed': '#97f5cc',
      surface: '#faf8ff', 'surface-container-low': '#f2f3ff', 'surface-container': '#eaedff', 'on-surface': '#131b2e',
      'on-surface-variant': '#3e484d', outline: '#6e797e', 'outline-variant': '#bdc8ce' },
    fontFamily: { sans: ['"Plus Jakarta Sans"', '"Noto Sans Georgian"', 'sans-serif'] } } } };
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; line-height: 1; }
</style>
</head>
<body class="bg-surface text-on-surface font-sans antialiased">
<header class="sticky top-0 z-50 bg-surface/85 backdrop-blur-md border-b border-outline-variant/30">
  <div class="max-w-7xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between gap-4">
    <a href="../index.html" class="flex items-center gap-2">
      <img src="../assets/logo.svg" alt="FIB" class="w-8 h-8">
      <span class="text-2xl font-bold tracking-tight text-primary">FIB</span>
      <span class="hidden sm:inline px-2 py-0.5 rounded-full text-[10px] font-semibold bg-surface-container text-primary uppercase tracking-wider">Mobile screens</span>
    </a>
    <nav class="flex items-center gap-1 text-sm font-semibold">
      <a href="../index.html" class="px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-low">Client</a>
      <a href="../provider.html" class="px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-low">Provider</a>
      <span class="px-3 py-2 rounded-lg bg-surface-container text-primary">Mobile</span>
    </nav>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-12">
  <section class="flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">მობილური ეკრანები</h1>
      <p class="text-on-surface-variant mt-2 max-w-2xl">FIB-ის ყველა მობილური ეკრანი Stitch-იდან, დალაგებული მომხმარებლის გზის მიხედვით. ეკრანზე დაწკაპუნებით გაიხსნება ცოცხალი გვერდი.</p>
    </div>
    <div class="flex items-center gap-1 p-1 rounded-full bg-surface-container-low border border-outline-variant/40 self-start md:self-auto" role="group" aria-label="Theme">
      <button data-theme="light" class="theme-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-sm font-semibold"><span class="material-symbols-outlined text-[18px]">light_mode</span>Light</button>
      <button data-theme="dark" class="theme-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-sm font-semibold"><span class="material-symbols-outlined text-[18px]">dark_mode</span>Dark</button>
    </div>
  </section>
  <div id="groups" class="space-y-12"></div>
</main>

<footer class="border-t border-outline-variant/30 py-6 text-center text-sm text-outline">FIB · NEBA Universal Service Marketplace · Stitch export</footer>

<script src="../assets/screens-data.js"></script>
<script>
(function () {
  let theme = 'light';
  try { theme = localStorage.getItem('fib-theme') || 'light'; } catch (e) {}
  const root = document.getElementById('groups');

  function render() {
    document.querySelectorAll('.theme-btn').forEach(b => {
      const on = b.dataset.theme === theme;
      b.className = 'theme-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-sm font-semibold ' + (on ? 'bg-primary text-white shadow-sm' : 'text-on-surface-variant hover:text-on-surface');
      b.setAttribute('aria-pressed', on);
    });
    root.innerHTML = window.FIB_SCREENS.map((g, gi) => `
      <section class="space-y-5">
        <div class="flex items-baseline gap-3">
          <span class="text-sm font-bold text-secondary tabular-nums">0${gi + 1}</span>
          <h2 class="text-2xl font-semibold tracking-tight">${g.group}</h2>
          <span class="text-sm text-outline">${g.en} · ${g.items.length}</span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 sm:gap-6">
          ${g.items.map(([slug, title, hasDark, hasLight]) => {
            const dark = (theme === 'dark' && hasDark) || !hasLight;
            const file = slug + (dark ? '-dark' : '');
            const note = theme === 'dark' && !hasDark ? '<span class="absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-white/90 text-outline border border-outline-variant/40">Light only</span>'
                       : theme === 'light' && !hasLight ? '<span class="absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-black/70 text-white">Dark only</span>' : '';
            return `<a href="${file}.html" class="group block">
              <div class="relative aspect-[9/16] rounded-2xl overflow-hidden border border-outline-variant/40 bg-surface-container-low shadow-sm group-hover:shadow-md group-hover:border-primary/50 transition-all">
                <img src="thumbs/${file}.png" alt="${title}" loading="lazy" class="w-full h-full object-cover object-top group-hover:scale-[1.02] transition-transform duration-300">
                ${note}
              </div>
              <p class="mt-2.5 text-sm font-semibold leading-snug group-hover:text-primary transition-colors">${title}</p>
            </a>`;
          }).join('')}
        </div>
      </section>`).join('');
  }

  document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => {
    theme = b.dataset.theme;
    try { localStorage.setItem('fib-theme', theme); } catch (e) {}
    render();
  }));
  render();
})();
</script>
</body>
</html>
